name: CI

on:
  push:
    branches: [main, "rag-quality-layer-*", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ─── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: hippocoredb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check
        working-directory: hippocoredb

  # ─── Clippy ──────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: hippocoredb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hippocoredb
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: hippocoredb

  # ─── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: hippocoredb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hippocoredb
      - name: cargo test
        run: cargo test --workspace
        working-directory: hippocoredb

  # ─── MSRV ────────────────────────────────────────────────────────────────────
  msrv:
    name: Minimum Supported Rust Version (1.74)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: hippocoredb
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"   # hippocore-server requires 1.75; core requires 1.74
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hippocoredb
      - name: cargo build (MSRV)
        run: cargo build --workspace
        working-directory: hippocoredb

  # ─── Security audit ──────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: hippocoredb
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
        working-directory: hippocoredb
