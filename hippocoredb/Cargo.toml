[workspace]
resolver = "2"
members = ["crates/hippocore", "crates/hippocore-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hippocoredb/hippocoredb"
authors = ["Hippocore DB contributors"]
rust-version = "1.74"

[workspace.dependencies]
hippocore = { path = "crates/hippocore", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
criterion = "0.5"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = "thin"
